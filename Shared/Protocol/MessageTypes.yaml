# LiveSync Protocol — Message Type Definitions
# Source of truth for all message opcodes and payload layouts.
# References: Types.yaml, Capabilities.yaml, Errors.yaml
# Python (MessageTypes.py) and C++ (MessageTypes.h) are GENERATED from this file.
# GENERATED FILES MUST NOT BE HAND-EDITED. All changes start from YAML.

# ─── Protocol Metadata ──────────────────────────────────────────

protocol:
  name: LiveSync
  version_major: 1
  version_minor: 0
  port_default: 14285

# ─── Wire Format ────────────────────────────────────────────────

wire_format:
  framing: length_prefixed
  byte_order: little_endian_all
  float_encoding: IEEE754_float32
  uuid_encoding: RFC4122_network_byte_order
  string_length_unit: bytes_not_characters

  # Version is NOT in the regular packet header.
  # Version is exchanged ONLY in HELLO/HELLO_ACK/REJECT during session establishment.
  # Rationale: keeps header small; version mismatch caught at session start.

  header_before_session:  # Used for HELLO, HELLO_ACK, REJECT only
    size: 6
    fields:
      - { name: MsgType,    type: uint8,                description: "Message type opcode" }
      - { name: Flags,      type: uint8,                description: "Flags bitmask (see flags)" }
      - { name: SequenceId, type: uint32, endian: little, description: "Monotonic sequence number" }

  header_after_session:   # Used for all messages after ACK
    size: 14
    fields:
      - { name: MsgType,    type: uint8,                description: "Message type opcode" }
      - { name: Flags,      type: uint8,                description: "Flags bitmask (see flags)" }
      - { name: SequenceId, type: uint32, endian: little, description: "Monotonic sequence number" }
      - { name: SessionId,  type: uint64, endian: little, description: "Session identifier" }

# ─── Flags Bitmask ──────────────────────────────────────────────

flags:
  bit_0:
    name: compressed
    description: "Payload is compressed (zlib deflate). Receiver must decompress before parsing."
    default: 0

  bit_1:
    name: encrypted
    description: "Payload is encrypted. Reserved for future use. MUST be zero in protocol v1. If non-zero, receiver MUST treat the message as INVALID_MESSAGE and handle it according to Errors.yaml."
    default: 0

  bit_2:
    name: ack_required
    description: "Sender expects SYNC_ACK for this message."
    default: 0

  bit_3:
    name: fragmented
    description: "Message is part of a fragmented transfer. More chunks follow."
    default: 0

  bit_4_7:
    name: reserved
    description: "Reserved. Must be 0. Do not use without protocol version bump."

# ─── SequenceId Rules ───────────────────────────────────────────

sequence_rules:
  type: uint32
  wraparound: "0xFFFFFFFF → 0x00000000"
  start: 0
  increment: 1
  per_sender: true
  initialized_when: "a new transport connection is established"
  never_reset_during: "session negotiation (HELLO/HELLO_ACK/REJECT)"
  description: >
    SequenceId is a monotonically increasing counter per sender.
    One SequenceId counter is maintained per sender per transport connection.
    Each side (client and server) has its own independent counter.
    Initialized to 0 when a new transport connection is established.
    Increments by 1 for each message sent.
    Session establishment (HELLO/HELLO_ACK/REJECT) does NOT reset the counter.
    The counter continues incrementing seamlessly through and after session negotiation.
    Wraps around at 0xFFFFFFFF to 0x00000000.

  comparison:
    method: modular_arithmetic
    pseudocode: |
      def is_newer(a, b):
          diff = (int32)(a - b)  # cast to signed 32-bit
          return diff > 0

      def is_older(a, b):
          return is_newer(b, a)

      def is_duplicate(a, b):
          return a == b
    rules:
      - "is_newer(a, b) = true: a is newer than b"
      - "is_older(a, b) = true: a is older than b"
      - "is_duplicate(a, b) = true: a and b are the same sequence"
    note: >
      This works correctly across wraparound because signed int32 subtraction
      preserves ordering within a window of 2^31 messages.
      If more than 2^31 messages go unacknowledged, ordering is undefined
      (this is an implementation constraint, not a protocol concern).

# ─── SessionId Rules ────────────────────────────────────────────

session_rules:
  type: uint64
  generation: "UE (server) generates during HELLO_ACK"
  when_generated: "After HELLO received and accepted"
  lifetime: "Entire session (connect → disconnect)"
  reconnect: "New session ID generated on each reconnect (never reused)"
  disconnect: "Session ID invalidated on disconnect"
  stale_detection: "If SessionId in message ≠ current session → drop silently"
  description: >
    SessionId is a 64-bit random value generated by UE during HELLO_ACK.
    All messages after HELLO_ACK must carry this SessionId in the header.
    On disconnect, both sides invalidate the session ID.
    On reconnect, a new session ID is generated (never reused).
    Stale messages from previous sessions are silently dropped.

# ─── Message Ordering Rules ─────────────────────────────────────

ordering_rules:
  transport: TCP
  guarantee: "TCP stream ordering — messages arrive in send order"
  description: >
    TCP guarantees in-order delivery. No application-level reordering needed.
    MessageRouter processes messages in arrival order.
    No out-of-order handling required in v1.
    If TCP ordering is ever broken (e.g., multiplexing), application-level
    sequencing via SequenceId would be needed — but not in v1.

# ─── SCENE_HASH Algorithm ──────────────────────────────────────

scene_hash_algorithm:
  hash_function: xxHash64
  seed: 0
  output: uint64
  canonical_float_rules:
    - "All floats must be IEEE 754 float32 little-endian."
    - "Negative zero (-0.0) MUST be converted to positive zero (+0.0) before hashing."
    - "NaN values MUST be rejected. If any float is NaN, the hash computation fails with an error."
    - "Quaternions MUST be normalized: q = q / |q|. If |q| is zero or near-zero (< 1e-7), use identity quaternion (0, 0, 0, 1)."
    - "No rounding or truncation beyond float32 precision."
  input:
    - "Sort all tracked object UUIDs lexicographically (by raw 16 bytes, ascending)."
    - "For each UUID in order, append:"
    - "  position_x, position_y, position_z (3 × float32 LE)"
    - "  rotation_x, rotation_y, rotation_z, rotation_w (4 × float32 LE, normalized)"
    - "  scale_x, scale_y, scale_z (3 × float32 LE)"
  encoding: "All values serialized as little-endian bytes before hashing"
  description: >
    SCENE_HASH is computed as xxHash64 over canonicalized transform data.
    Both sides MUST apply the same canonicalization rules.
    If canonicalization fails (NaN, degenerate quaternion), the hash
    computation fails and full scene sync is triggered instead.

# ─── Chunk Transfer Rules ──────────────────────────────────────

chunk_rules:
  timeout_seconds: 30
  timeout_resets: "Timer resets to 30s every time a new MESH_CHUNK is received for the same transfer."
  on_timeout: "Discard entire transfer, clean up partial data, increment CHUNK_TIMEOUT error counter."
  max_chunks: 65535
  description: >
    Chunked mesh transfer uses MESH_START → MESH_CHUNK(s) → MESH_END.
    A 30-second inactivity timer starts after MESH_START.
    The timer resets each time a new MESH_CHUNK is received.
    If the timer expires (30s without a new chunk), the transfer is discarded.
    Receiver must track received chunks and detect gaps.
    Sender must send chunks sequentially (no parallel chunks per object).
    MESH_END includes checksum for verification.

# ─── Message Types ──────────────────────────────────────────────

messages:

  # --- Session Establishment (pre-session header) ---
  HELLO:
    code: 0x10
    direction: B→U
    header: before_session
    session_required: false
    body:
      - { name: protocol_version_major, type: uint8 }
      - { name: protocol_version_minor, type: uint8 }
      - { name: capabilities,           type: uint64, endian: little }
    description: "Client initiates session. Sends version + capabilities."

  HELLO_ACK:
    code: 0x11
    direction: U→B
    header: before_session
    session_required: false
    body:
      - { name: protocol_version_major,  type: uint8 }
      - { name: protocol_version_minor,  type: uint8 }
      - { name: accepted_capabilities,  type: uint64, endian: little }
      - { name: max_chunk_size,          type: uint32, endian: little }
      - { name: session_id,              type: uint64, endian: little }
    description: "Server accepts session. Sends version + accepted capabilities + session_id."

  REJECT:
    code: 0x12
    direction: U→B
    header: before_session
    session_required: false
    body:
      - { name: error_code,          type: uint16, endian: little }
      - { name: reason,              type: utf8_string }
      - { name: min_version_major,   type: uint8 }
      - { name: min_version_minor,   type: uint8 }
      - { name: max_version_major,   type: uint8 }
      - { name: max_version_minor,   type: uint8 }
    description: "Server rejects session. Version mismatch or incompatible capabilities."

  # --- System (post-session header) ---
  HEARTBEAT:
    code: 0x00
    direction: both
    session_required: false
    body: null
    description: "Keepalive (empty body). Sent every 10s."

  HEARTBEAT_ACK:
    code: 0x01
    direction: both
    session_required: false
    body: null
    description: "Keepalive response (empty body)."

  SCENE_HASH:
    code: 0x02
    direction: both
    session_required: true
    body:
      - { name: hash,          type: uint64 }
      - { name: object_count,  type: uint32 }
    description: "Scene registry hash for incremental reconnect."

  # --- Scene ---
  SCENE_FULL:
    code: 0x03
    direction: B→U
    session_required: true
    body:
      - { name: object_count, type: uint32 }
    description: "Full scene state (sent on connect/reconnect)."

  SCENE_DELTA:
    code: 0x04
    direction: B→U
    session_required: true
    body:
      - { name: object_count, type: uint32 }
    description: "Changed objects only."

  # --- Object ---
  OBJECT_CREATE:
    code: 0x20
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id,   type: uuid }
      - { name: name,            type: utf8_string }
      - { name: parent_id,       type: uuid, optional: true }
      - { name: primitive_type,  type: uint8 }
      - { name: transform,       type: transform3d }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,       type: float64 }
    description: "New object (transform + metadata). sequence_number enables stale-rejection; timestamp for ordering."

  OBJECT_UPDATE:
    code: 0x21
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id,   type: uuid }
      - { name: transform,       type: transform3d, optional: true }
      - { name: name,            type: utf8_string, optional: true }
      - { name: visibility,      type: uint8, optional: true }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,       type: float64 }
    description: "Property changes (delta). sequence_number enables stale-rejection; timestamp for ordering."

  OBJECT_DELETE:
    code: 0x22
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id,     type: uuid }
      - { name: sequence_number,   type: uint32 }
      - { name: timestamp,         type: float64 }
    description: "Remove object. sequence_number enables stale-rejection; timestamp for ordering."

  OBJECT_RENAME:
    code: 0x23
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: new_name,      type: utf8_string }
    description: "Rename object."

  OBJECT_REPARENT:
    code: 0x24
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: new_parent_id, type: uuid }
    description: "Change parent."

  OBJECT_VISIBILITY:
    code: 0x25
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: visible,       type: uint8 }
    description: "Show/hide."

  # --- Mesh ---
  MESH_DATA:
    code: 0x30
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: vertex_count,  type: uint32 }
      - { name: index_count,   type: uint32 }
      - { name: format_flags,  type: uint8 }
      - { name: vertices,      type: f32_array, count: "vertex_count * 3" }
      - { name: normals,       type: f32_array, count: "vertex_count * 3" }
      - { name: uvs,           type: f32_array, count: "vertex_count * 2" }
      - { name: indices,       type: u32_array, count: "index_count" }
    description: "Full mesh data."

  MESH_DELTA:
    code: 0x31
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: vertex_count,  type: uint32 }
      - { name: format_flags,  type: uint8 }
      - { name: vertices,      type: f32_array, count: "vertex_count * 3" }
      - { name: normals,       type: f32_array, count: "vertex_count * 3" }
      - { name: uvs,           type: f32_array, count: "vertex_count * 2" }
    description: "Vertex-only updates (no topology change)."

  MESH_START:
    code: 0x32
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: total_chunks,  type: uint16 }
      - { name: format_flags,  type: uint8 }
    description: "Begin chunked mesh transfer."

  MESH_CHUNK:
    code: 0x33
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: chunk_index,   type: uint16 }
      - { name: vertex_offset, type: uint16 }
      - { name: vertex_count,  type: uint32 }
      - { name: index_count,   type: uint32 }
      - { name: data,          type: raw_bytes }
    description: "Mesh data chunk."

  MESH_END:
    code: 0x34
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: checksum,      type: uint32 }
    description: "End chunked mesh transfer."

  # --- Material ---
  MATERIAL_CREATE:
    code: 0x40
    direction: B→U
    session_required: true
    body:
      - { name: material_id,   type: uuid }
      - { name: name,          type: utf8_string }
      - { name: base_color,    type: f32_array, count: 4 }
      - { name: metallic,      type: float32 }
      - { name: roughness,     type: float32 }
      - { name: emission,      type: f32_array, count: 3 }
      - { name: texture_path,  type: utf8_string, optional: true }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,      type: float64 }
    description: "New material definition. sequence_number enables stale-rejection; timestamp for ordering."

  MATERIAL_UPDATE:
    code: 0x41
    direction: B→U
    session_required: true
    body:
      - { name: material_id,   type: uuid }
      - { name: base_color,    type: f32_array, count: 4 }
      - { name: metallic,      type: float32 }
      - { name: roughness,     type: float32 }
      - { name: emission,      type: f32_array, count: 3 }
      - { name: texture_path,  type: utf8_string, optional: true }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,      type: float64 }
    description: "Parameter changes. Material properties are always packed (full state); texture_path is the only optional field."

  MATERIAL_ASSIGN:
    code: 0x42
    direction: B→U
    session_required: true
    body:
      - { name: persistent_id, type: uuid }
      - { name: material_id,   type: uuid }
      - { name: slot_index,    type: uint8 }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,      type: float64 }
    description: "Assign material to slot."

  # --- Camera ---
  CAMERA_CREATE:
    code: 0x50
    direction: B→U
    session_required: true
    body:
      - { name: camera_id,      type: uuid }
      - { name: name,           type: utf8_string }
      - { name: parent_id,      type: uuid, optional: true }
      - { name: transform,      type: transform3d }
      - { name: focal_length,   type: float32 }
      - { name: sensor_width,   type: float32 }
      - { name: sensor_height,  type: float32 }
      - { name: clip_start,     type: float32 }
      - { name: clip_end,       type: float32 }
      - { name: ortho_scale,    type: float32 }
      - { name: camera_flags,   type: uint8, description: "bit0=is_ortho; bit1=DEPRECATED has_camera_def (compat only, new senders MUST ignore)" }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,      type: float64 }
    description: "New camera with full state. sequence_number enables stale-rejection; timestamp for ordering. camera_flags bit1 (has_camera_def) is DEPRECATED and will be removed in a future migration."

  CAMERA_UPDATE:
    code: 0x51
    direction: B→U
    session_required: true
    body:
      - { name: camera_id,      type: uuid }
      - { name: transform,      type: transform3d, optional: true }
      - { name: focal_length,   type: float32, optional: true }
      - { name: sensor_width,   type: float32, optional: true }
      - { name: sensor_height,  type: float32, optional: true }
      - { name: clip_start,     type: float32, optional: true }
      - { name: clip_end,       type: float32, optional: true }
      - { name: ortho_scale,    type: float32, optional: true }
      - { name: camera_flags,   type: uint8, optional: true, description: "bit0=is_ortho; bit1=DEPRECATED has_camera_def" }
      - { name: sequence_number, type: uint32 }
      - { name: timestamp,      type: float64 }
    description: "Property delta. sequence_number enables stale-rejection; timestamp for ordering. camera_flags bit1 (has_camera_def) is DEPRECATED."

  CAMERASETACTIVE:
    code: 0x52
    direction: B→U
    session_required: true
    body:
      - { name: camera_id,     type: uuid }
    description: "Set as active viewport camera."

  # --- System Response ---
  SYNC_ACK:
    code: 0xF0
    direction: U→B
    session_required: true
    body:
      - { name: acked_seq,     type: uint32 }
    description: "Acknowledge sync data."

  ERROR:
    code: 0xFE
    direction: both
    session_required: false
    body:
      - { name: error_code,    type: uint16 }
      - { name: message,       type: utf8_string }
    description: "Error with code + message."

  DISCONNECT:
    code: 0xFF
    direction: both
    session_required: false
    body: null
    description: "Graceful disconnect."

# ─── Normative Authority ─────────────────────────────────────────
# Protocol.md is INFORMATIVE. YAML files are NORMATIVE.
# If Protocol.md contradicts these YAML files, the YAML files win.
# Code generators must read YAML as the source of truth.

# ─── Header Invariants ──────────────────────────────────────────
header_invariants:
  pre_session:
    applies_to: [HELLO, HELLO_ACK, REJECT]
    must_contain: [MsgType, Flags, SequenceId]
    must_not_contain: [SessionId]
    wire_size: 6
    description: "Pre-session messages use 6-byte header only. No SessionId."

  post_session:
    applies_to: "All messages except HELLO, HELLO_ACK, REJECT"
    must_contain: [MsgType, Flags, SequenceId, SessionId]
    wire_size: 14
    description: "Post-session messages use 14-byte header with SessionId."

  rule: >
    Pre-session messages MUST NOT contain SessionId.
    Post-session messages MUST contain SessionId.
    This invariant must be enforced by both serializer and deserializer.

# ─── Uniqueness Invariants ──────────────────────────────────────
uniqueness_invariants:
  opcodes:
    rule: "Every opcode defined in MessageTypes.yaml MUST appear exactly once."
    enforcement: "Code generator MUST verify no duplicate opcodes at build time."
  capability_bits:
    rule: "Every capability bit defined in Capabilities.yaml MUST appear exactly once."
    enforcement: "Code generator MUST verify no duplicate bits at build time."
  error_codes:
    rule: "Every error code defined in Errors.yaml MUST appear exactly once."
    enforcement: "Code generator MUST verify no duplicate codes at build time."
